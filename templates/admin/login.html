<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | Shiv Traders Portal</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <!-- Admin CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/admin.css') }}">
</head>
<body style="display: flex; align-items: center; justify-content: center; min-height: 100vh; background: #f8fafc;">

    <div style="width: 100%; max-width: 440px; padding: 1.5rem;">
        <div class="form-card" style="border: 1px solid var(--red-border); box-shadow: var(--shadow-lg); padding: 2.5rem 2rem; background: #ffffff;">
            <!-- Brand Header -->
            <div style="text-align: center; margin-bottom: 2rem;">
                <div class="brand-mark" style="margin: 0 auto 1rem auto; width: 50px; height: 50px; font-size: 1.5rem;">ST</div>
                <h2 style="font-family: 'Outfit', sans-serif; font-size: 1.75rem; color: var(--text-main); margin-bottom: 0.25rem;">SHIV TRADERS</h2>
                <p style="color: var(--red-primary); font-size: 0.82rem; text-transform: uppercase; letter-spacing: 0.1em; font-weight: 700;">Secure Administrator Gateway</p>
            </div>

            <!-- Flash Error Message -->
            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    {% for category, message in messages %}
                        <div style="background: rgba(239, 68, 68, 0.15); border: 1px solid rgba(239, 68, 68, 0.4); color: #f87171; padding: 0.75rem 1rem; border-radius: 6px; font-size: 0.88rem; margin-bottom: 1.5rem; display: flex; align-items: center; gap: 0.5rem;">
                            <i class="fas fa-exclamation-circle"></i>
                            <span>{{ message }}</span>
                        </div>
                    {% endfor %}
                {% endif %}
            {% endwith %}

            <form method="POST" action="{{ url_for('admin_login') }}">
                <div class="form-group-admin">
                    <label for="email"><i class="fas fa-envelope text-gold"></i> Administrator Email</label>
                    <input type="email" id="email" name="email" class="form-control-admin" required placeholder="admin@shivtraders.com" value="admin@shivtraders.com">
                </div>

                <div class="form-group-admin">
                    <label for="password"><i class="fas fa-lock text-gold"></i> Password</label>
                    <div style="position: relative;">
                        <input type="password" id="password" name="password" class="form-control-admin" required placeholder="Enter password" value="Admin@ShivTraders2026">
                        <button type="button" onclick="const p=document.getElementById('password'); p.type=p.type==='password'?'text':'password';" style="position: absolute; right: 12px; top: 50%; transform: translateY(-50%); background: none; border: none; color: var(--text-dim); cursor: pointer;">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                </div>

                <div style="margin-bottom: 1.5rem; display: flex; justify-content: space-between; font-size: 0.82rem; color: var(--text-sub);">
                    <span><i class="fas fa-shield-alt text-gold"></i> Protected Session</span>
                    <span style="color: var(--gold-light);">Firebase Auth</span>
                </div>

                <button type="submit" class="btn btn-primary btn-lg" style="width: 100%;">
                    <i class="fas fa-sign-in-alt"></i> Access Dashboard
                </button>
            </form>

            <div style="text-align: center; margin-top: 1.75rem; border-top: 1px solid var(--border-color); padding-top: 1.25rem;">
                <a href="{{ url_for('index') }}" style="color: var(--text-sub); font-size: 0.85rem; display: inline-flex; align-items: center; gap: 0.5rem;">
                    <i class="fas fa-arrow-left"></i> Return to Shiv Traders Website
                </a>
            </div>
        </div>
    </div>

</body>
</html>
